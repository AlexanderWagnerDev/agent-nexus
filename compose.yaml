services:
  hub:
    image: ghcr.io/alexanderwagnerdev/agent-nexus:${NEXUS_TAG:-alpha}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NEXUS_ADDR: "0.0.0.0:8080"
      NEXUS_DATA_DIR: "/data"
      NEXUS_PUBLIC_URL: "https://${HUB_DOMAIN:-localhost}"
      NEXUS_HUB_NAME: "${HUB_NAME:-AgentNexus}"
      NEXUS_METRICS: "${NEXUS_METRICS:-false}"
      NEXUS_METRICS_TOKEN: "${NEXUS_METRICS_TOKEN:-}"
    volumes:
      - nexus-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/nexus-hub", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HUB_DOMAIN: "${HUB_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nexus-data:
  caddy-data:
  caddy-config:

