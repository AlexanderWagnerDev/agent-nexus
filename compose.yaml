services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      NEXUS_ADDR: "0.0.0.0:8080"
      NEXUS_DATA_DIR: "/data"
      NEXUS_PUBLIC_URL: "https://${HUB_DOMAIN:-localhost}"
      NEXUS_HUB_NAME: "${HUB_NAME:-AgentNexus}"
    volumes:
      - nexus-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      HUB_DOMAIN: "${HUB_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nexus-data:
  caddy-data:
  caddy-config:
