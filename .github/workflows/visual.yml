name: Visual regression (manual and nightly)

# Baselines are captured from the synthetic demo with a pinned clock and are
# committed per platform because font rasterisation differs. To refresh them,
# dispatch this workflow with update_baselines enabled, download the
# visual-baseline-<os> artifact and commit its files.
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate this runner's baselines and upload them instead of comparing
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Demo pixel diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build hub and synthetic host
        run: |
          mkdir -p bin
          go build -trimpath -o bin/nexus-hub ./cmd/nexus-hub
          go build -trimpath -o bin/nexus-demo ./cmd/nexus-demo
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regenerate baselines
        if: ${{ inputs.update_baselines }}
        working-directory: web
        env:
          E2E_SPAWN_DEMO: "1"
          DEMO_PORT: "8791"
        run: npm run e2e:visual:update
      - name: Compare demo views with baselines
        if: ${{ !inputs.update_baselines }}
        working-directory: web
        env:
          E2E_SPAWN_DEMO: "1"
          DEMO_PORT: "8791"
          VISUAL_MAX_RATIO: "0.01"
        run: npm run e2e:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ inputs.update_baselines }}
        with:
          name: visual-baseline-${{ runner.os }}
          path: web/e2e/demo/visual-baseline/${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() && !inputs.update_baselines }}
        with:
          name: visual-report
          path: visual-report
          retention-days: 14
          if-no-files-found: ignore
