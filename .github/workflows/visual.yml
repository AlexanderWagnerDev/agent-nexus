name: Visual regression (manual and nightly)

# Baselines are captured from the synthetic demo with a pinned clock. They are
# currently produced on Windows 11; the Windows runner has slightly different
# font rasterisation, hence the wider tolerance in this job. Linux/macOS
# reference baselines do not exist yet.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Demo pixel diff
    runs-on: avrea-windows-2025-2-vcpu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build hub and synthetic host
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -trimpath -o bin/nexus-hub.exe ./cmd/nexus-hub
          go build -trimpath -o bin/nexus-demo.exe ./cmd/nexus-demo
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
      - name: Compare demo views with baselines
        working-directory: web
        env:
          E2E_SPAWN_DEMO: "1"
          DEMO_PORT: "8791"
          VISUAL_MAX_RATIO: "0.05"
        run: npm run e2e:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-report
          path: visual-report
          retention-days: 14
          if-no-files-found: ignore
