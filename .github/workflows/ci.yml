name: CI

# Workflows run on Avrea-hosted runners. Avrea GitHub App access is required.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: avrea-ubuntu-26.04 }
          - { os: windows, runner: avrea-windows-2025-2-vcpu }
          - { os: macOS, runner: avrea-macos-26-8-vcpu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files
        if: runner.os == 'Linux'
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test ./...
      - name: tests with coverage
        if: runner.os == 'Linux'
        run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      - name: JavaScript syntax
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: node web/scripts/check-syntax.mjs

  race:
    name: Race detector
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  build:
    name: Cross-compile
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build hub and daemon
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/nexus-hub-${GOOS}-${GOARCH}${ext}" ./cmd/nexus-hub
          go build -trimpath -ldflags="-s -w" -o "dist/nexusd-${GOOS}-${GOARCH}${ext}" ./cmd/nexusd

  browser:
    name: Browser E2E
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build hub
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/nexus-hub ./cmd/nexus-hub
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run renderer and tool-format unit tests
        working-directory: web
        run: npm test
      - name: Run browser smoke test
        working-directory: web
        env:
          E2E_SPAWN_HUB: "1"
        run: node e2e/smoke.mjs
      - name: Run virtualized session-list test
        working-directory: web
        env:
          E2E_SPAWN_HUB: "1"
          E2E_VIRTUAL_PORT: "18789"
        run: node e2e/virtual.mjs

  vulnerability:
    name: govulncheck
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  demo:
    name: Synthetic three-host demo
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build hub and synthetic host
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/nexus-hub ./cmd/nexus-hub
          CGO_ENABLED=0 go build -trimpath -o bin/nexus-demo ./cmd/nexus-demo
      - name: Seed and verify three synthetic hosts
        env:
          DEMO_VERIFY: "1"
        run: node web/e2e/demo/seed.mjs

  staticcheck:
    name: staticcheck
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  actionlint:
    name: actionlint
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  licenses:
    name: Dependency licenses
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Download Go modules
        run: go mod download
      - name: Check licenses
        run: node scripts/check-licenses.mjs
