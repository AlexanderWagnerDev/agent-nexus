name: Dev host binaries

# Development builds only. These artifacts are not releases: no tag, no GitHub
# release and no "latest" image is created. Downloading them needs an
# authenticated GitHub session with read access to this private repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: nexusd (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="nexusd-$GOOS-$GOARCH$ext"
          go build -trimpath -ldflags="-s -w" -o "dist/$out" ./cmd/nexusd
          (cd dist && sha256sum "$out" > "$out.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexusd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 30
