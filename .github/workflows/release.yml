name: Release (manual, locked)

# Publication is intentionally manual. The project is in alpha and has no
# official version. Nothing in this workflow runs on a normal commit or tag.
# A future maintainer must dispatch it explicitly, point it at an existing tag
# and type the confirmation word. See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish, for example v0.1.0'
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH to confirm an intentional public release'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$CONFIRM" != "PUBLISH" ]; then
            echo "Refusing to release: confirm input must be exactly PUBLISH." >&2
            exit 1
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Refusing to release: tag must start with v and a digit." >&2; exit 1 ;;
          esac

  release:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Goreleaser invokes syft for the per-archive SBOMs configured in
      # .goreleaser.yml. Install the same reviewed version the sbom-action
      # pins rather than downloading a floating binary at release time.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
