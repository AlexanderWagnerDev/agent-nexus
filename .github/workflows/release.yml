name: Release

# Publication is intentionally manual. No push or tag triggers this workflow.
# A maintainer creates and pushes the annotated tag first, then dispatches this
# workflow from that tag. The OIDC certificate identity is the ref that started
# the run, so dispatching from main would make every cosign bundle fail the
# installers' and updater's refs/tags/ identity check.
# See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or republish, for example v0.1.16'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Refusing to release: tag must start with v and a digit." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Refusing to release: tag must look like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

  release:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Ensure the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "Refusing to release: dispatch from the tag $TAG (got $GITHUB_REF)." >&2
            echo "Cosign keyless identity is bound to the ref that started the run." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to release: tag $TAG does not exist; create and push it first." >&2
            exit 1
          fi
          echo "Publishing the existing tag $TAG at $(git rev-list -n1 "refs/tags/$TAG")."
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      # Goreleaser invokes syft for the per-archive SBOMs configured in
      # .goreleaser.yml. Install the same reviewed version the sbom-action
      # pins rather than downloading a floating binary at release time.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
